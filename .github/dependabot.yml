# Weekly proposals for updates: GitHub's actions, npm packages, and the base
# images. Each arrives as a pull request, and CI checks it before merging.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directories: ["/", "/server", "/client", "/e2e"]
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    open-pull-requests-limit: 5

  - package-ecosystem: docker
    directories: ["/server", "/client"]
    schedule:
      interval: weekly

  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
