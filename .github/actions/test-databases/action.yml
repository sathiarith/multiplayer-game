# Starts the test databases exactly as on a developer's machine (see the README),
# and waits until both really answer.
name: Test databases
description: Postgres in memory with fsync off on port 5433, and Redis on 6379, both ready.

runs:
  using: composite
  steps:
    - name: Start Postgres and Redis
      shell: bash
      run: |
        docker run -d --name game-postgres-test -p 127.0.0.1:5433:5432 \
          -e POSTGRES_USER=game -e POSTGRES_PASSWORD=game-dev-only -e POSTGRES_DB=game \
          --tmpfs /var/lib/postgresql \
          postgres:18 -c fsync=off -c synchronous_commit=off -c full_page_writes=off
        docker run -d --name game-redis -p 127.0.0.1:6379:6379 redis:7

    # Ask Postgres over TCP (-h 127.0.0.1): while it sets itself up, a new
    # container briefly runs a temporary server that answers on its socket only.
    - name: Wait until both are ready
      shell: bash
      run: |
        for attempt in $(seq 1 60); do
          if docker exec game-postgres-test pg_isready -h 127.0.0.1 -U game -d game > /dev/null 2>&1 \
            && docker exec game-redis redis-cli ping > /dev/null 2>&1; then
            echo "Postgres and Redis are ready"
            exit 0
          fi
          sleep 1
        done
        echo "::error::Postgres or Redis was not ready after 60 seconds"
        docker logs game-postgres-test
        docker logs game-redis
        exit 1
