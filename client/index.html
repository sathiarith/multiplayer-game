<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Multiplayer Game</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="game">
      <canvas id="game" width="800" height="600"></canvas>
      <div class="hud">
        <span class="hud__name" id="hud-name"></span>
        <div class="hud__bar"><div class="hud__fill" id="hud-fill"></div></div>
        <span class="hud__hp" id="hud-hp"></span>
        <span class="hud__pos" id="hud-pos"></span>
      </div>
    </div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
