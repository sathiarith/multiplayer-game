# How the visitor reached us. Behind Caddy, nginx itself receives plain HTTP,
# so pass on Caddy's answer ("https"); with no proxy in front, use our own.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Serves the built React client, and forwards the API and the game to the
# server container. In development, Vite's proxy does the same job.
server {
    listen 8080;
    server_name _;
    server_tokens off; # don't announce nginx's version, in headers or error pages
    root /usr/share/nginx/html;

    # The server's own health (Postgres and Redis included), for outside
    # monitors: 200 when everything works, 503 when something doesn't.
    location = /healthz {
        proxy_pass http://server:3001/health;
        access_log off; # a check every few minutes would only add noise
    }

    # The REST API.
    location /api/ {
        proxy_pass http://server:3001;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }

    # The game: Socket.IO switches to a WebSocket, which needs the Upgrade and
    # Connection headers passed on. Without them, the game never connects.
    location /socket.io/ {
        proxy_pass http://server:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_read_timeout 1h; # a game connection stays open for a long time
    }

    # Built files have their content's fingerprint in their names, so a new
    # version always has a new name: browsers may keep these for a year.
    location /assets/ {
        try_files $uri =404;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else is the React app: its router decides what to show.
    # index.html itself is never cached, so a new release is picked up at once.
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}